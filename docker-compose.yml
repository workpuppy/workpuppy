services:
  wp:
    # 两种用法都支持：
    #   docker compose pull      → 拉已发布的多架构镜像（latest 会自动选本机架构）
    #   docker compose up -d --build → 用本地源码构建（改代码时用）
    image: ghcr.io/workpuppy/workpuppy:latest
    build: .
    container_name: wp
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      # 管理密码不再随机生成，也不读环境变量：
      #   首次打开 http://<host>:7863/ 会引导设置密码（加盐 10 轮 SHA256，
      #   存进 data/config.json 的 admin.password）。
    ports:
      - "7863:7863"
    volumes:
      # auths 凭证卷：login.sh 在宿主机落盘 workbuddy-<uid>.json（0600），容器网关以
      # app(uid 10001) 读 + 回写（refresh / realm backfill 走 tmp+rename，需目录写权限）。
      # 跨 uid 部署（非 root 宿主落盘 / rootful 下宿主 uid≠10001）读不到 → 账号数为 0
      # （issue #108）。登录后把目录属主交给 10001（与 ./data 卷同口径）：
      #   chown -R 10001:10001 ./auths
      # 之后新增账号建议进容器登录（app 自身落盘，属主即 10001，免反复 chown；容器内无
      # docker CLI，完成后回宿主机重启）：
      #   docker compose exec -it wp bash -c './login.sh' && docker compose restart wp
      - ./auths:/app/auths
      # data 卷：配置、状态、积分日账、model.json 都在这里。
      #   - config.json 首次启动自动生成（内容 = config.default.json）；
      #   - 设置页保存配置需要该目录可写，宿主机执行：
      #       chown -R 10001:10001 ./data
      - ./data:/app/data
